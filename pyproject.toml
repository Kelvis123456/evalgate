[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalgate"
version = "0.1.0"
description = "A CI ship gate for RAG and LLM apps: versioned eval set, committed baseline, non-zero exit on regression."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Kelvis Guerrero" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9.2.0"]

[project.scripts]
evalgate = "evalgate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"evalgate.refapp" = ["corpus.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
